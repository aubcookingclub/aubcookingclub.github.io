/* ---------- Recipe PDF ---------- */
function recipePDF(ev,r=recipesOf(ev)[0]){
  if(!window.jspdf){toast("The PDF tool didn’t load. Try again in a moment.");return}
  const {jsPDF}=window.jspdf, d=new jsPDF({unit:"pt",format:"a4"});
  const W=595,H=842, BOTTOM=H-66, clean=s=>s.replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,"-");
  // paper background, ruled lines, margin line and frame; the first page also gets the header circles
  const paper=first=>{
    d.setFillColor(247,242,232);d.rect(0,0,W,H,"F");
    d.setDrawColor(182,206,213);d.setLineWidth(.6);for(let y=first?150:62;y<H-60;y+=22)d.line(40,y,W-40,y);
    d.setDrawColor(201,137,117);d.setLineWidth(1.2);d.line(70,first?130:40,70,H-50);
    d.setDrawColor(63,85,69);d.setLineWidth(2);d.rect(24,24,W-48,H-48);d.setLineWidth(.7);d.rect(30,30,W-60,H-60);
    d.setFont("times","italic");d.setFontSize(13);d.setTextColor(201,137,117);d.text("Made with love by the AUB Cooking Club.",W/2,H-44,{align:"center"});
  };
  // start a new page when a block whose last line sits `need` pt below y would pass the bottom margin
  const room=(y,need=0)=>{ if(y+need<=BOTTOM) return y; d.addPage(); paper(false); d.setFont("times","italic");d.setFontSize(12);d.setTextColor(63,85,69);d.text(clean(r.name)+" (continued)",86,56); d.setFont("helvetica","normal");d.setFontSize(11);d.setTextColor(70,60,53); return 84; };
  paper(true);
  d.setFillColor(241,218,164);d.circle(W-92,92,40,"F");d.setFillColor(201,137,117);d.circle(W-92,92,16,"F");
  d.setFillColor(232,191,190);d.circle(W-60,60,10,"F");
  d.setTextColor(63,85,69);d.setFont("helvetica","bold");d.setFontSize(9);d.text("AUB COOKING CLUB  *  OUR RECIPE FOR MEMORIES",54,64);
  d.setFont("times","bold");d.setFontSize(36);d.text(clean(r.name),54,108);
  d.setFont("helvetica","normal");d.setFontSize(10.5);d.setTextColor(70,60,53);
  d.text(clean(`From Chapter ${ev.chapter}: ${ev.title} ${ev.subtitle} (${fmtDate(ev.date)})`),54,126);
  let y=168;
  d.setFillColor(241,218,164);d.roundedRect(86,y-14,110,22,11,11,"F");d.setFillColor(182,206,213);d.roundedRect(204,y-14,80,22,11,11,"F");
  d.setFont("helvetica","bold");d.setFontSize(10);d.text(clean("Time: "+r.time),96,y+1);d.text("Serves "+r.serves,214,y+1);
  y+=44;d.setFont("times","bold");d.setFontSize(18);d.setTextColor(63,85,69);d.text("You'll need",86,y);y+=22;
  d.setFont("helvetica","normal");d.setFontSize(11);d.setTextColor(70,60,53);
  r.ingredients.forEach(x=>{const ls=d.splitTextToSize(clean(x),400);y=room(y,(ls.length-1)*22);d.setFillColor(201,137,117);d.circle(92,y-3.5,2.2,"F");ls.forEach(l=>{d.text(l,102,y);y+=22})});
  y=room(y+14,44);d.setFont("times","bold");d.setFontSize(18);d.setTextColor(63,85,69);d.text("Let's cook",86,y);y+=22;
  d.setFont("helvetica","normal");d.setFontSize(11);d.setTextColor(70,60,53);
  r.steps.forEach((x,i)=>{const ls=d.splitTextToSize(clean(x),400);y=room(y,(ls.length-1)*22);d.setFont("helvetica","bold");d.text(String(i+1)+".",86,y);d.setFont("helvetica","normal");ls.forEach(l=>{d.text(l,104,y);y+=22})});
  saveFile(`${r.name.toLowerCase().replace(/\s+/g,"-")}-aub-cooking-club.pdf`,d.output("blob"));
}

/* ---------- Tap & click touches (shared helpers + the parts outside #app) ---------- */
const Rr=(a,b)=>a+Math.random()*(b-a);
/* one little flying bit (juice, herb, crumb...) inside a positioned parent, from (x,y), arcing out and falling */
function flick(parent,x,y,{cls="drop",color="#F1DAA4",w,h,spread=60,up=40,fall=60,dur=800}={}){
  const d=document.createElement("span"); d.className=cls; d.style.background=color; if(w){d.style.width=w+"px";d.style.height=(h||w)+"px";}
  const dx=Rr(-spread,spread), u=Rr(up*.5,up), f=Rr(fall*.5,fall), r=Rr(-180,180);
  parent.appendChild(d);
  d.animate([{transform:`translate(${x}px,${y}px) rotate(0deg) scale(.6)`,opacity:1,easing:"cubic-bezier(.2,.7,.4,1)"},
    {transform:`translate(${x+dx*.6}px,${y-u}px) rotate(${r/2}deg) scale(1)`,opacity:1,offset:.35,easing:"cubic-bezier(.6,0,.9,.5)"},
    {transform:`translate(${x+dx}px,${y-u+f}px) rotate(${r}deg) scale(.8)`,opacity:0}],{duration:Rr(dur*.8,dur*1.2)}).onfinish=()=>d.remove();
}
const mk=html=>{const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstChild;};

/* "Join the table": a toaster pops a slice of toast that says "save a seat!" above the WhatsApp button */
function popToaster(){
  const t=$(".toaster"); if(!t||t._busy||reduce.matches) return; t._busy=true; t.classList.add("on");
  const slice=t.querySelector(".slice"), ding=t.querySelector(".ding"), body=t.querySelector(".body"), T=4200;
  SFX.play("pop",T*.25/1000); SFX.play("ding",T*.3/1000);   // the toast pops up, "ding!"
  const parts=[
    t.animate([{opacity:0,transform:"scale(.6) translateY(10px)"},{opacity:1,transform:"scale(1.06)",offset:.08},{opacity:1,transform:"none",offset:.12},{opacity:1,transform:"none",offset:.9},{opacity:0,transform:"translateY(6px)"}],{duration:T,fill:"forwards"}),
    slice.animate([{transform:"translateY(40px)"},{transform:"translateY(40px)",offset:.22},{transform:"translateY(-12px)",offset:.32,easing:"ease-out"},{transform:"translateY(0)",offset:.38},{transform:"translateY(0)",offset:.78},{transform:"translateY(40px)",offset:.88},{transform:"translateY(40px)"}],{duration:T,fill:"forwards"}),
    body.animate([{transform:"none"},{transform:"none",offset:.22},{transform:"scale(1.05,.92)",offset:.26},{transform:"rotate(-4deg)",offset:.3},{transform:"rotate(3deg)",offset:.34},{transform:"none",offset:.38},{transform:"none"}],{duration:T}),
    ding.animate([{opacity:0,transform:"scale(.5)"},{opacity:0,transform:"scale(.5)",offset:.24},{opacity:1,transform:"scale(1.2) rotate(10deg)",offset:.31},{opacity:1,transform:"rotate(8deg)",offset:.5},{opacity:0,transform:"rotate(8deg)",offset:.62},{opacity:0}],{duration:T})];
  parts[0].onfinish=()=>{parts.forEach(a=>a.cancel()); t.classList.remove("on"); t._busy=false;};
}
$(".toaster")&&$(".toaster").addEventListener("click",popToaster);

/* photo viewer: double-tap (or double-click) a photo for a heart-shaped cookie */
function heartAt(x,y){
  if(reduce.matches) return;
  const r=lb.getBoundingClientRect();
  const h=mk(`<svg class="lbheart" viewBox="0 0 110 100" aria-hidden="true"><path d="M55 94C20 68 5 50 5 31 5 15 17 5 31 5c11 0 19 6 24 15C60 11 68 5 79 5c14 0 26 10 26 26 0 19-15 37-50 63z" fill="#E9C9A0" stroke="#463C35" stroke-width="3" stroke-linejoin="round"/><path d="M55 80C29 61 18 48 18 34c0-10 7-17 16-17 8 0 14 5 21 14 7-9 13-14 21-14 9 0 16 7 16 17 0 14-11 27-37 46z" fill="#E8BFBE"/><g stroke="#463C35" stroke-width="1"><rect x="36" y="30" width="7" height="2.6" rx="1.3" fill="#F1DAA4" transform="rotate(30 39 31)"/><rect x="62" y="28" width="7" height="2.6" rx="1.3" fill="#B6CED5" transform="rotate(-20 65 29)"/><rect x="50" y="48" width="7" height="2.6" rx="1.3" fill="#FFFDF8" transform="rotate(60 53 49)"/><rect x="70" y="44" width="7" height="2.6" rx="1.3" fill="#A5B49C" transform="rotate(10 73 45)"/><rect x="40" y="50" width="7" height="2.6" rx="1.3" fill="#B6CED5" transform="rotate(-50 43 51)"/></g></svg>`);
  h.style.left=(x-r.left)+"px"; h.style.top=(y-r.top)+"px"; lb.appendChild(h);
  h.animate([{transform:"scale(0) rotate(-15deg)",opacity:1},{transform:"scale(1.3) rotate(6deg)",opacity:1,offset:.25},{transform:"scale(1) rotate(0)",opacity:1,offset:.4},
    {transform:"scale(1) rotate(0)",opacity:1,offset:.7},{transform:"translateY(-46px) scale(.8)",opacity:0}],{duration:1300,easing:"ease-out"}).onfinish=()=>h.remove();
  for(let i=0;i<7;i++) flick(lb,x-r.left,y-r.top,{color:["#E9C9A0","#E8BFBE","#F1DAA4"][i%3],spread:80,up:50,fall:70,dur:900});
}
lbImg.addEventListener("dblclick",e=>heartAt(e.clientX,e.clientY));
let lbLastTap=0;
lbImg.addEventListener("touchend",e=>{const t=Date.now(),c=e.changedTouches[0]; if(t-lbLastTap<300){heartAt(c.clientX,c.clientY);lbLastTap=0}else lbLastTap=t},{passive:true});

/* photo viewer: downloading packs the photo into a little takeaway box, "to go!" */
/* camera shutter "ka-chick" when a photo is downloaded */
function shutterSound(){ SFX.play("shutter"); }
function toGo(p){
  if(reduce.matches) return;
  const g=mk(`<svg class="togo" viewBox="0 0 130 130" aria-hidden="true"><g class="all">
    <g class="ph"><image href="${p.thumb||p.url}" x="42" y="6" width="46" height="46" preserveAspectRatio="xMidYMid slice"/><rect x="42" y="6" width="46" height="46" fill="none" stroke="#FFFDF8" stroke-width="4"/></g>
    <path d="M46 64q19-30 38 0" fill="none" stroke="#463C35" stroke-width="2.5"/>
    <path d="M25 64h80l-8 54q-1 6-7 6H40q-6 0-7-6z" fill="#FFFDF8" stroke="#463C35" stroke-width="3" stroke-linejoin="round"/>
    <path d="M29 84h72" stroke="#C98975" stroke-width="7"/><path d="M58 100l7-5 7 5" fill="none" stroke="#463C35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="fl" x="25" y="57" width="40" height="7" rx="2" fill="#F7F2E8" stroke="#463C35" stroke-width="2.5"/>
    <rect class="fr" x="65" y="57" width="40" height="7" rx="2" fill="#F7F2E8" stroke="#463C35" stroke-width="2.5"/>
    <text class="tg" x="118" y="44" text-anchor="middle" font-family="Caveat,cursive" font-weight="700" font-size="22" fill="#F1DAA4" opacity="0">to go!</text></g></svg>`);
  lb.appendChild(g); const q=s=>g.querySelector(s), T=2100;
  q(".all").animate([{transform:"translateY(90px)",opacity:0},{transform:"none",opacity:1,offset:.14,easing:"ease-out"},{transform:"none",offset:.74,easing:"ease-in"},{transform:"translateX(330px) rotate(8deg)",opacity:0}],{duration:T});
  q(".ph").animate([{transform:"translateY(-20px)",opacity:0},{transform:"translateY(-20px)",opacity:1,offset:.14},{transform:"translateY(-20px)",offset:.2,easing:"ease-in"},{transform:"translateY(54px) scale(.85)",offset:.38}],{duration:T,fill:"forwards"});
  q(".fl").style.transformOrigin="0% 50%"; q(".fr").style.transformOrigin="100% 50%";
  q(".fl").animate([{transform:"rotate(-105deg)"},{transform:"rotate(-105deg)",offset:.38},{transform:"rotate(6deg)",offset:.48},{transform:"rotate(0)",offset:.52}],{duration:T,fill:"forwards"});
  q(".fr").animate([{transform:"rotate(105deg)"},{transform:"rotate(105deg)",offset:.42},{transform:"rotate(-6deg)",offset:.52},{transform:"rotate(0)",offset:.56}],{duration:T,fill:"forwards"});
  q(".tg").animate([{opacity:0,transform:"scale(.5)"},{opacity:0,transform:"scale(.5)",offset:.54},{opacity:1,transform:"scale(1.15) rotate(-8deg)",offset:.62},{opacity:1,transform:"rotate(-8deg)",offset:.74},{opacity:0}],{duration:T,fill:"forwards"});
  setTimeout(()=>g.remove(),T+50);
}

/* workshop date chip: a little tomato kitchen timer winds up, ticks down and rings */
function kitchenTimer(chip){
  if(reduce.matches||chip._busy) return; chip._busy=true;
  const ticks=Array.from({length:8},(_,i)=>{const a=i*Math.PI/4;return `M${(30+Math.cos(a)*12).toFixed(1)} ${(42+Math.sin(a)*12).toFixed(1)}L${(30+Math.cos(a)*15).toFixed(1)} ${(42+Math.sin(a)*15).toFixed(1)}`}).join("");
  const k=mk(`<svg class="ktimer" viewBox="0 0 60 70" aria-hidden="true"><g class="tm">
    <path d="M30 18q-9-9-16-3 8 2 16 3zm0 0q9-9 16-3-8 2-16 3z" fill="#A5B49C" stroke="#463C35" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="30" cy="42" r="24" fill="#C98975" stroke="#463C35" stroke-width="3"/><circle cx="30" cy="42" r="16.5" fill="#FFFDF8" stroke="#463C35" stroke-width="2"/>
    <path d="${ticks}" stroke="#463C35" stroke-width="1.6" stroke-linecap="round"/>
    <g class="dial"><circle cx="30" cy="42" r="16" fill="none"/><path d="M30 42V29" stroke="#463C35" stroke-width="3" stroke-linecap="round"/><circle cx="30" cy="42" r="3" fill="#463C35"/></g></g>
    <text class="dg" x="56" y="16" font-family="Caveat,cursive" font-weight="700" font-size="17" fill="#C98975" opacity="0">ding!</text></svg>`);
  chip.appendChild(k); const q=s=>k.querySelector(s), T=2200;
  for(let s=T*.28;s<T*.73;s+=150) SFX.play("tick",s/1000);   // ticking while the dial runs down...
  SFX.play("ding",T*.76/1000);                                // ...then the bell
  q(".tm").style.transformOrigin="50% 60%"; q(".dial").style.transformOrigin="50% 50%";
  q(".tm").animate([{transform:"scale(0)",opacity:0},{transform:"scale(1.1)",opacity:1,offset:.1},{transform:"scale(1)",offset:.14},{transform:"rotate(0)",offset:.74},
    {transform:"rotate(-12deg)",offset:.77},{transform:"rotate(12deg)",offset:.8},{transform:"rotate(-10deg)",offset:.83},{transform:"rotate(8deg)",offset:.86},{transform:"rotate(0)",offset:.9,opacity:1},{transform:"scale(.6)",opacity:0}],{duration:T,fill:"forwards"});
  q(".dial").animate([{transform:"rotate(0)"},{transform:"rotate(0)",offset:.14},{transform:"rotate(-300deg)",offset:.26,easing:"steps(10,end)"},{transform:"rotate(0)",offset:.74}],{duration:T,fill:"forwards"});
  q(".dg").animate([{opacity:0,transform:"scale(.5)"},{opacity:0,transform:"scale(.5)",offset:.75},{opacity:1,transform:"scale(1.15) rotate(8deg)",offset:.8},{opacity:1,transform:"rotate(8deg)",offset:.9},{opacity:0}],{duration:T,fill:"forwards"});
  setTimeout(()=>{k.remove();chip._busy=false;},T+50);
}

/* secret: tap the logo three times quickly and it gets a chef hat (three more taps take it off) */
(()=>{
  const logo=$(".logo"); if(!logo) return; let taps=[];
  logo.addEventListener("click",()=>{
    const now=Date.now(); taps=taps.filter(t=>now-t<1200); taps.push(now); if(taps.length<3) return; taps=[];
    const old=logo.querySelector(".chefhat");
    if(old){ if(reduce.matches){old.remove();return;} old.animate([{transform:"none",opacity:1},{transform:"translate(18px,-34px) rotate(40deg)",opacity:0}],{duration:450,easing:"ease-in"}).onfinish=()=>old.remove(); setTimeout(()=>old.remove(),500); return; }
    const hat=mk(`<svg class="chefhat" viewBox="0 0 50 46" aria-hidden="true"><path d="M12 31c-8 0-12-6-10-12 2-7 10-8 13-5 1-8 9-12 15-9 5-6 15-4 17 4 6-1 10 4 8 10-1 5-6 8-11 8z" fill="#FFFDF8" stroke="#463C35" stroke-width="2.5" stroke-linejoin="round"/><rect x="12" y="28" width="28" height="12" rx="3" fill="#FFFDF8" stroke="#463C35" stroke-width="2.5"/><path d="M19 30v8M26 30v8M33 30v8" stroke="#E3D9C6" stroke-width="2"/></svg>`);
    logo.appendChild(hat); toast("Chef mode: on!");
    if(reduce.matches) return;
    hat.animate([{transform:"translateY(-60px) rotate(-30deg)",opacity:0,easing:"cubic-bezier(.5,0,1,.6)"},{transform:"translateY(0) scale(1.15,.8)",opacity:1,offset:.55,easing:"ease-out"},{transform:"translateY(-5px) scale(.95,1.06)",offset:.75},{transform:"none"}],{duration:650});
    setTimeout(()=>{ for(let i=0;i<10;i++) flick(logo,22,0,{cls:"herb",color:["#A5B49C","#3F5545"][i%2],spread:40,up:26,fall:46,dur:900}); },360);
  });
})();

/* ---------- Footer plate: served when the footer comes into view; tap / click / Enter for seconds ---------- */
(()=>{
  const plate=$("footer .plate"); if(!plate||reduce.matches) return;
  const serving=plate.querySelector(".serving"), hearts=[...plate.querySelectorAll(".heart")];
  let busy=false, served=false;
  plate.classList.add("empty");
  const serve=()=>{
    if(busy) return; busy=true;
    const drop=()=>{
      if(served) plate.dataset.meal = plate.dataset.meal==="burger" ? "pasta" : "burger"; // seconds alternate burger <-> spaghetti
      plate.classList.remove("empty");
      serving.animate([{transform:"translateY(-70px) scale(.9,1.1)",opacity:1,easing:"cubic-bezier(.5,0,1,.6)"},
        {transform:"translateY(0) scale(1.18,.78)",offset:.5,easing:"ease-out"},{transform:"translateY(-6px) scale(.94,1.08)",offset:.72,easing:"ease-in"},
        {transform:"translateY(0) scale(1,1)"}],{duration:750});
      hearts.forEach((h,i)=>h.animate([{opacity:0,transform:"translateY(10px) scale(.4)"},{opacity:1,transform:"translateY(-4px) scale(1.1)",offset:.35},{opacity:0,transform:"translateY(-26px) scale(.9)"}],
        {duration:1200,delay:650+i*140,easing:"ease-out"}));
      setTimeout(()=>{busy=false;served=true;},650+hearts.length*140+1200);
    };
    if(served){ // the old serving gets eaten (shrinks away), then seconds arrive
      serving.animate([{transform:"scale(1)",opacity:1},{transform:"scale(.2,.1)",opacity:0}],{duration:320,easing:"ease-in"}).onfinish=()=>{plate.classList.add("empty");setTimeout(drop,180)};
    } else drop();
  };
  const pio=new IntersectionObserver(es=>es.forEach(x=>{ if(x.isIntersecting){ pio.disconnect(); setTimeout(serve,300); } }),{threshold:.7});
  pio.observe(plate);
  plate.addEventListener("click",serve);
  plate.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); serve(); } });
})();

/* ---------- Back-to-top button (long pages) + footer year ---------- */
(()=>{
  const b=$("#totop"); if(!b) return; let shown=false, tick=false;
  const check=()=>{ tick=false; const on=scrollY>innerHeight*2.5 && document.documentElement.scrollHeight>innerHeight*4;
    if(on!==shown){ shown=on; b.classList.toggle("show",on); b.tabIndex=on?0:-1; } };
  addEventListener("scroll",()=>{ if(!tick){ tick=true; requestAnimationFrame(check); } },{passive:true});
  b.addEventListener("click",()=>{ scrollTo({top:0,behavior:reduce.matches?"auto":"smooth"}); app.focus({preventScroll:true}); });
  const y=$("#year"); if(y) y.textContent=new Date().getFullYear();
})();

render(EVENTS.some(e=>e.slug===start)||start==="memories"||start==="register"?start:"home",{push:false,animate:false});
try{history.replaceState({r:current},"")}catch(e){}
